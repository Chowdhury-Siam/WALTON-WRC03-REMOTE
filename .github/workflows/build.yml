name: Build and release Android APK
concurrency:
  group: quiet-remote-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify IR signals
        run: |
          python3 tools/check_signals.py
          python3 tools/check_release.py
          mkdir -p build/selfcheck
          javac -d build/selfcheck app/src/main/java/dev/siam/quietremote/Wrc03.java tools/SignalSelfTest.java
          java -cp build/selfcheck SignalSelfTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Quiet-Remote-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Quiet-Remote-APK
          path: build/download
      - name: Publish stable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish_stable.sh build/download/app-debug.apk
